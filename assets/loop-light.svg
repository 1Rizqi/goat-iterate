<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="The goat-iterate loop: the lead sets the bar and dispatches builders; builders build every checklist line and save per-line evidence; a fresh critic judges each round from evidence; the lead keeps what passed and batches every FAIL into the next round; the loop stops when the bar is met or the budget is spent.">
  <rect width="1200" height="620" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="618" rx="24" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="600" y="64" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2328">The loop</text>

  <!-- role cards -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- LEAD -->
    <rect x="80" y="110" width="300" height="190" rx="14" fill="#f6f8fa" stroke="#bc4c00" stroke-width="2"/>
    <text x="230" y="152" text-anchor="middle" font-size="24" font-weight="700" fill="#bc4c00">LEAD</text>
    <text x="230" y="188" text-anchor="middle" font-size="17" fill="#1f2328">your main agent</text>
    <text x="230" y="218" text-anchor="middle" font-size="15" fill="#57606a">writes spec.md + eye.md</text>
    <text x="230" y="244" text-anchor="middle" font-size="15" fill="#57606a">dispatches builders</text>
    <text x="230" y="270" text-anchor="middle" font-size="15" fill="#57606a">keeps best-so-far</text>

    <!-- BUILDERS -->
    <rect x="450" y="110" width="300" height="190" rx="14" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
    <text x="600" y="152" text-anchor="middle" font-size="24" font-weight="700" fill="#1a7f37">BUILDERS</text>
    <text x="600" y="188" text-anchor="middle" font-size="17" fill="#1f2328">worker subagents</text>
    <text x="600" y="218" text-anchor="middle" font-size="15" fill="#57606a">build every checklist line</text>
    <text x="600" y="244" text-anchor="middle" font-size="15" fill="#57606a">commit their deliverable</text>
    <text x="600" y="270" text-anchor="middle" font-size="15" fill="#57606a">save per-line evidence</text>

    <!-- CRITIC -->
    <rect x="820" y="110" width="300" height="190" rx="14" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
    <text x="970" y="152" text-anchor="middle" font-size="24" font-weight="700" fill="#0969da">CRITIC</text>
    <text x="970" y="188" text-anchor="middle" font-size="17" fill="#1f2328">fresh subagent each round</text>
    <text x="970" y="218" text-anchor="middle" font-size="15" fill="#57606a">never builds</text>
    <text x="970" y="244" text-anchor="middle" font-size="15" fill="#57606a">PASS / FAIL / UNSEEN + scores</text>
    <text x="970" y="270" text-anchor="middle" font-size="15" fill="#57606a">max 3 professional rejections</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#57606a" stroke-width="3" fill="none">
    <path d="M 380 190 L 444 190"/>
    <path d="M 750 190 L 814 190"/>
  </g>
  <g fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
    <path d="M 444 190 l -12 -6 v 12 z"/>
    <path d="M 814 190 l -12 -6 v 12 z"/>
    <text x="397" y="178">brief</text>
    <text x="762" y="178">evidence</text>
  </g>

  <!-- verdict arrow back to lead -->
  <g stroke="#57606a" stroke-width="3" fill="none">
    <path d="M 970 300 L 970 360 L 230 360 L 230 306"/>
  </g>
  <path d="M 230 306 l -6 12 h 12 z" fill="#57606a"/>
  <text x="600" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">verdict + aspect scores, pairwise vs best-so-far</text>

  <!-- batch arrow critic back to builders -->
  <g stroke="#1a7f37" stroke-width="3" fill="none" stroke-dasharray="8 6">
    <path d="M 1060 300 L 1060 430 L 600 430 L 600 306"/>
  </g>
  <path d="M 600 306 l -6 12 h 12 z" fill="#1a7f37"/>
  <text x="830" y="452" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a7f37">next round: every FAIL + UNSEEN + new line, grouped by root cause</text>

  <!-- stop bar -->
  <rect x="80" y="490" width="1040" height="86" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="526" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Stop when the bar is met</text>
  <text x="600" y="556" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">≥90% PASS · every aspect ≥8 · no open rejection → done · otherwise: BAR NOT MET</text>
</svg>
