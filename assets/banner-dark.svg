<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="goat-iterate: the build-critique loop for AI coding agents">
  <rect width="1200" height="320" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="318" rx="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- mark: three-node loop -->
  <g transform="translate(120,160)">
    <circle cx="0" cy="-52" r="30" fill="none" stroke="#f0883e" stroke-width="5"/>
    <circle cx="45" cy="26" r="30" fill="none" stroke="#3fb950" stroke-width="5"/>
    <circle cx="-45" cy="26" r="30" fill="none" stroke="#58a6ff" stroke-width="5"/>
    <path d="M 22 -34 A 62 62 0 0 1 44 2" fill="none" stroke="#8b949e" stroke-width="4" stroke-linecap="round"/>
    <path d="M 30 44 A 62 62 0 0 1 -30 44" fill="none" stroke="#8b949e" stroke-width="4" stroke-linecap="round"/>
    <path d="M -44 2 A 62 62 0 0 1 -22 -34" fill="none" stroke="#8b949e" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="-44" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f0883e">L</text>
    <text x="45" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#3fb950">B</text>
    <text x="-45" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#58a6ff">C</text>
  </g>

  <text x="270" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="108" font-weight="800" fill="#e6edf3" letter-spacing="1">goat-iterate</text>
  <text x="274" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#8b949e">Builders build. A fresh critic judges. Keep the best.</text>
  <text x="274" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#6e7681">the build-critique loop for AI coding agents</text>
</svg>
